name: Build 9 Star Ki MCP connector

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'integrations/NineStarKi.Mcp/**'
      - 'integrations/NineStarKi.OAuth.Persistence/**'
      - '.github/workflows/9-star-ki-mcp.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore integrations/NineStarKi.Mcp/NineStarKi.Mcp.csproj
      - name: Build
        run: dotnet build integrations/NineStarKi.Mcp/NineStarKi.Mcp.csproj --configuration Release --no-restore
      - name: Test membership authorisation
        run: dotnet test integrations/NineStarKi.Mcp.Tests/NineStarKi.Mcp.Tests.csproj --configuration Release
      - name: Restore isolated OAuth EF6 store
        run: dotnet restore integrations/NineStarKi.OAuth.Persistence/NineStarKi.OAuth.Persistence.csproj
      - name: Build isolated OAuth EF6 store
        run: dotnet build integrations/NineStarKi.OAuth.Persistence/NineStarKi.OAuth.Persistence.csproj --configuration Release --no-restore
      - name: Publish
        run: dotnet publish integrations/NineStarKi.Mcp/NineStarKi.Mcp.csproj --configuration Release --no-restore --output artifacts/nine-star-ki-mcp
      - name: Upload deployable package
        uses: actions/upload-artifact@v4
        with:
          name: nine-star-ki-mcp
          path: artifacts/nine-star-ki-mcp/
          if-no-files-found: error
